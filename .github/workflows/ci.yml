name: CI

# Controlli su ogni pull request verso master: test, export, smoke test del sito
# e anteprima della versione che verrà pubblicata al merge.
# Niente trigger `push`: con una PR aperta ogni push farebbe girare lo stesso job due volte.
# Per controllare un branch senza PR: Actions → CI → Run workflow.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # servono tag e storia per calcolare la versione
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium

      - name: Export del workbook (fallisce se ci sono errori di schema)
        run: python scripts/export_xlsx.py
      - name: Indice dei documenti ufficiali dei fondi (senza rete, controlla registro e file)
        run: python scripts/documenti.py indice
      - name: Test (schema, versioni, smoke test del sito)
        run: python -m unittest discover -s tests -v

      - name: Anteprima della versione
        if: github.event_name == 'pull_request'
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          bump=auto
          case ",$LABELS," in
            *,release:major,*) bump="major" ;;
            *,release:minor,*) bump="minor" ;;
            *,release:patch,*) bump="patch" ;;
          esac
          v=$(python scripts/versione.py prossima --bump "$bump")
          {
            echo "### Al merge verrà pubblicata la versione \`$v\`"
            echo
            python scripts/versione.py note --versione "$v" --bump "$bump" --repo "$GITHUB_REPOSITORY"
          } >> "$GITHUB_STEP_SUMMARY"
